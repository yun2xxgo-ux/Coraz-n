
 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💖 Liz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #080514;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Tamaño responsivo
    const SIZE = Math.min(window.innerWidth, window.innerHeight, 800);
    canvas.width  = SIZE;
    canvas.height = SIZE;

    const W = SIZE;
    const H = SIZE;
    const TEXT = "Liz";
    const FONT_SIZE = Math.max(8, Math.floor(SIZE / 100));
    const COLOR = 'rgba(255, 80, 130, ';   // rosa, se cierra con alpha + ')'

    // ── Fórmula paramétrica del corazón ──────────────────────────────────
    function heartPoints(n, scale) {
      const cx = W / 2;
      const cy = H / 2 - SIZE * 0.02;
      const pts = [];
      for (let i = 0; i < n; i++) {
        const t = (i / n) * 2 * Math.PI;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t)
                  - 5  * Math.cos(2 * t)
                  - 2  * Math.cos(3 * t)
                  -      Math.cos(4 * t));
        pts.push([cx + x * scale, cy + y * scale]);
      }
      return pts;
    }

    // ── Crear partículas ──────────────────────────────────────────────────
    const particles = [];
    const LAYERS = 9;
    const BASE_SCALE = SIZE / 333;   // equivalente a 2.4 en 800px

    for (let layer = 1; layer <= LAYERS; layer++) {
      const s   = layer * BASE_SCALE;
      const n   = 12 + layer * 6;
      const pts = heartPoints(n, s);
      pts.forEach(([tx, ty]) => {
        particles.push({
          x:     Math.random() * W,
          y:     Math.random() * H,
          tx,
          ty,
          alpha: 0,
          delay: Math.floor(Math.random() * 80)   // cuadros de espera
        });
      });
    }

    // ── Bucle de animación ────────────────────────────────────────────────
    let frame = 0;

    ctx.font = `bold ${FONT_SIZE}px Arial`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';

    function draw() {
      // Fondo semitransparente → efecto de estela suave
      ctx.fillStyle = 'rgba(8, 5, 20, 0.35)';
      ctx.fillRect(0, 0, W, H);

      frame++;

      // Latido: oscila entre 0.95 y 1.05
      const beat = 1 + 0.05 * Math.sin(frame * 0.08);

      const cx = W / 2;
      const cy = H / 2 - SIZE * 0.02;

      for (const p of particles) {
        if (frame < p.delay) continue;

        // Destino multiplicado por el latido
        const dx = cx + (p.tx - cx) * beat;
        const dy = cy + (p.ty - cy) * beat;

        // Movimiento suave: avanza 6 % de la distancia restante
        p.x += (dx - p.x) * 0.06;
        p.y += (dy - p.y) * 0.06;

        // Aparición gradual
        p.alpha = Math.min(1, p.alpha + 0.016);  // ≈ 4/255 normalizado

        ctx.fillStyle = COLOR + p.alpha + ')';
        ctx.fillText(TEXT, p.x, p.y);
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>

</body>
</html>
